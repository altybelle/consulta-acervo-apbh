<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta local ao inventário do Arquivo Público de Belo Horizonte.">
  <title>Consulta ao Acervo · APBH</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="brand-mark" aria-hidden="true">AP</div>
    <div>
      <p class="eyebrow">Arquivo Público de Belo Horizonte</p>
      <h1>Consulta ao inventário</h1>
    </div>
    <p class="status" id="collection-status">Carregando acervo…</p>
  </header>

  <main>
    <section class="search-panel" aria-labelledby="search-title">
      <div class="search-heading">
        <div>
          <p class="section-label">Pesquisa integrada</p>
          <h2 id="search-title">Encontre documentos no acervo</h2>
        </div>
        <button class="text-button" id="clear-button" type="button">Limpar filtros</button>
      </div>
      <form id="search-form" role="search">
        <label class="query-field">
          <span class="sr-only">Termos da pesquisa</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.7-4.7m2.2-5.3a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="query" name="q" autocomplete="off" placeholder="Pessoa, evento, lugar, dossiê ou número…">
          <button type="submit">Pesquisar</button>
        </label>
        <div class="filters">
          <label>Acervo
            <select id="collection" name="collection"><option value="">Todos os acervos</option></select>
          </label>
          <fieldset>
            <legend>Período</legend>
            <label><span class="sr-only">Ano inicial</span><input id="year-from" name="year_from" inputmode="numeric" maxlength="4" placeholder="Ano inicial"></label>
            <span aria-hidden="true">—</span>
            <label><span class="sr-only">Ano final</span><input id="year-to" name="year_to" inputmode="numeric" maxlength="4" placeholder="Ano final"></label>
          </fieldset>
        </div>
      </form>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <div class="results-header">
        <div>
          <p class="section-label">Resultados</p>
          <h2 id="results-heading">Visão geral do inventário</h2>
        </div>
        <p id="result-count" aria-live="polite"></p>
      </div>
      <div id="results" class="results-list" aria-busy="true"></div>
      <nav id="pagination" class="pagination" aria-label="Paginação dos resultados"></nav>
    </section>
  </main>

  <dialog id="record-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <div><p class="section-label" id="dialog-collection"></p><h2 id="dialog-title"></h2></div>
      <button id="close-dialog" class="icon-button" aria-label="Fechar detalhes" type="button">×</button>
    </div>
    <div id="dialog-content" class="record-detail"></div>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
